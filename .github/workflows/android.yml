---

name: Android

"on":
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    container: fedora:45
    # The pixiewood build compiles GTK and libadwaita for two ABIs; expect 1h+.
    timeout-minutes: 360
    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100

      - name: Android host prerequisites
        run: |
          dnf install -y \
            just java-21-openjdk-devel \
            perl-Glib perl-Glib-Object-Introspection perl-IPC-Run perl-JSON \
            perl-Set-Scalar perl-XML-LibXML perl-XML-LibXSLT \
            appstream gcc gcc-c++ glib2-devel glib2-tools libxml2-utils \
            ninja-build sassc glslc unzip curl git python3 python3-pip pkg-config gettext
          java -version

      - name: Check Android scripts
        run: bash -n misc/android/scripts/*.sh

      # setup.sh downloads the pinned SDK/NDK and pixiewood, then configures the
      # cross build. A build failure fails the job; no device tests run in CI.
      - name: Setup
        run: just android-app-setup

      - name: Build
        run: just android-app-build

      - name: Verify APK
        run: |
          apk=misc/android/build/rsnote-android.apk
          test -s "$apk"
          for abi in arm64-v8a x86_64; do
            unzip -l "$apk" "lib/$abi/librnote.so" >/dev/null
          done
          unzip -l "$apk" AndroidManifest.xml >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rsnote-android-apk
          path: misc/android/build/rsnote-android.apk
          if-no-files-found: error
          retention-days: 30
